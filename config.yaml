server:
  api_host: 0.0.0.0
  api_port: 5075
  gradio_host: 0.0.0.0
  gradio_port: 7860
data:
  poster_prefix: data/content/sorted_movie_posters_paligema
  plots_csv: data/movie_plots.csv
  plot_col_candidates:
  - movie_plot
  - plot
  - description
  - synopsis
  poster_col: movie_poster_path
  genre_col: movie_category
  title_col: title
  plots_path: data/movie_plots.csv
clip:
  model_name: ViT-B/32
  embedding_dim: 512
index:
  annoy_path: assets/clip_movies.ann
  meta_path: assets/clip_meta.json
  num_trees: 100
  n_candidates: 5000
  annoy_search_k: 20000
poster_model:
  model_path_12: weights_12/movie_poster_net.pth
plot_model:
  model_path_3: weights_3
  ann_path: plot_embeddings.ann
  embedding_dim: 768
ood:
  config_path: ood_config.json
  method: entropy
  threshold: 1.05
genres:
  mapping:
    horror: 0
    thriller: 1
    romance: 2
    action: 3
    comedy: 4
    drama: 5
    sci-fi: 6
    fantasy: 7
    documentary: 8
    animation: 9
    crime: 10
    adventure: 11
