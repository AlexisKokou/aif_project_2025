services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-api
    ports:
      - "5075:5075"
    environment:
      - PUBLIC_API_BASE_URL=http://api:5075
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - OOD_CONFIG_PATH=ood_config.json
    networks:
      - movie-network
    restart: unless-stopped

  gradio-app:
    build:
      context: .
      dockerfile: Dockerfile-gradio
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5075
    networks:
      - movie-network
    restart: unless-stopped

networks:
  movie-network:
    driver: bridge
