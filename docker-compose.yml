services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-api
    ports:
      - "5075:5075"
    volumes:
      - ./config.yaml:/app/config.yaml
      # Monte uniquement les dossiers utiles
      # - ./weights:/app/weights  # Décommente si tu utilises des poids
      # - ./models:/app/models    # Décommente si tu utilises des modèles
      - ./data:/app/data
      # - ./sorted_movie_posters_paligema:/app/sorted_movie_posters_paligema:ro  # Décommente si tu utilises ce dossier
    environment:
      - PUBLIC_API_BASE_URL=http://34.170.114.145:5075
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - OOD_CONFIG_PATH=ood_config.json
    networks:
      - movie-network
    restart: unless-stopped

  gradio-app:
    build:
      context: .
      dockerfile: Dockerfile-gradio
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5075
    volumes:
      - ./config.yaml:/app/config.yaml
     # - ./weights:/app/weights
     # - ./models:/app/models
      - ./data:/app/data
     # - ./sorted_movie_posters_paligema:/app/sorted_movie_posters_paligema:ro
    networks:
      - movie-network
    restart: unless-stopped

networks:
  movie-network:
    driver: bridge
